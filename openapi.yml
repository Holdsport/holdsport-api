          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityTaskAssignRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                id: 840001
                name: Alex Example
                user_id: 700001
              schema:
                $ref: '#/components/schemas/ActivityTaskAssignment'
          description: The member already had the task; the stored assignment.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
        '201':
          content:
            application/json:
              example:
                id: 840002
                name: Sam Sample
                user_id: 700002
              schema:
                $ref: '#/components/schemas/ActivityTaskAssignment'
          description: The new assignment.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/BasicUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LoginBusy'
      summary: Take a task, or assign one to a member
      tags:
        - Tasks
      x-holdsport-quirk: |
        Assignments are taken one at a time per task, so two requests can no
        longer both take the last place. Other clients (the web, the app)
        still check the limit on their own, so a task can occasionally hold
        more members than `max_participants`. Any path extension
        (`.xml`) is accepted and answered in JSON.
  /v1/activities/{activity_id}/guests:
    get:
      description: |
        The guests of one activity. When an activity allows guests, a member
        who attends can register guests of the activity's guest types (for
        example "Gastspieler" or "Kind (5-12 Jahre)"), with the guest's name
        when the coach requires guest names. These are the guests that the
        app and the website list as "Guest of …" and that the Excel export
        lists in its guests column.

        One entry per guest, ordered by guest type (in the order the coach
        created the types) and then in the order the guests were added. A
        member with three guests has three entries with the same `user_id`;
        count the entries per `user_id` for a count per member. Guest types
        the coach has turned off are left out. Cancelled activities and
        activities without registration keep their guests and list them here,
        although the website does not show the guest list for them.

        Guests are not members: they have no user id of their own and never
        appear in `activities_users`.

        **Privacy:** when the coach has turned on "Hide member registration
        status", a user who is not a coach or club manager of the activity,
        its creator, or a manager of its teams, departments or clubs gets only
        the guests they brought themselves (often an empty array), as on the
        website.

        **When to use:** show or export who comes as a guest, for example to
        transfer attendance to a club portal. Read-only; no side effects.

        The activity must be visible to the user, as for `getActivity`;
        otherwise, and for an unknown id, the answer is `404`.
