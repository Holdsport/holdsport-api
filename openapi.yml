---
components:
  headers:
    CacheControl:
      description: '`must-revalidate, private, max-age=0` with an ETag; otherwise `no-cache, private` or `private`.'
      schema:
        type: string
    ETag:
      description: Weak validator, `W/"<first 32 hex characters of SHA-256(body)>"`. Send it back in `If-None-Match`.
      required: true
      schema:
        pattern: ^W/"[0-9a-f]{32}"$
        type: string
    WWWAuthenticate:
      description: Always `Basic realm="API"`.
      required: true
      schema:
        const: Basic realm="API"
        type: string
  parameters:
    ActivityDate:
      description: |
        First day of the window, `YYYY-MM-DD` (also `YYYY-M-D`). Defaults to
        today in Copenhagen; a value that is not a date, or a year outside
        1–9999, also means today.
      example: 2026-11-21
      in: query
      name: date
      required: false
      schema:
        type: string
      x-holdsport-quirk: |
        Parsed leniently, like Ruby's `Date.parse`: `21/11/2026`,
        `21.11.2026`, `20261121`, `December 1, 2025`, `1. dec 2025` and
        `Dec 1` (this year) are dates too. A month name alone is the first of
        that month this year, so any word containing one counts (`junk` is
        June 1), and a weekday alone is that day of the current
        Sunday-to-Saturday week. ISO week and day-of-year forms with a dash
        (`2025-W48-1`, `2025-335`) mean today. Send `YYYY-MM-DD`.
    ActivityId:
      description: Activity id. Only the leading digits count (`57001.json` is the JSON form).
      example: 51234567
      in: path
      name: id
      required: true
      schema:
        type: integer
    ActivityIfNoneMatch:
      description: The `ETag` of an earlier response; a match answers `304`.
      in: header
      name: If-None-Match
      required: false
      schema:
        type: string
    ActivityLocale:
      description: |
        Language of the status, action and event type names (`da`, `en`,
        `de`, `nb`, `sv`, `fr`, `es`, `ca`, `hu`, `it`, `fo`, `en_gb`). Default:
        the user's language. Missing names fall back towards Danish.
      example: en
      in: query
      name: locale
      required: false
      schema:
        type: string
    ActivityPage:
      description: Page number, from 1. Values below 1 or not a number mean 1; `2x` means 2.
      example: '1'
      in: query
      name: page
      required: false
      schema:
        type: string
    ActivityPerPage:
      description: |
        Activities per page. Missing: 20. At most 1000 (larger values give
        1000). `0` gives an empty list.
      example: '50'
      in: query
      name: per_page
      required: false
      schema:
        type: string
      x-holdsport-quirk: |
        An empty value, a negative number or text that does not start with a
        digit gives 25, not 20; `20abc` gives 20.
    ActivityTeamId:
      description: |
        Team id, or the team's URL slug. A numeric value is first tried as a
        slug, then as an id (leading zeros allowed); anything else is only a
        slug, so `1,2,3` or `undefined` is `404`.
      example: '64001'
      in: path
      name: team_id
      required: true
      schema:
        type: string
    ActivityUpdatedSince:
      description: |
        Only activities changed after this time (UTC, `YYYY-MM-DD` or
        `YYYY-MM-DD HH:MM:SS`). Answering an activity counts as a change.
      example: 2026-11-01 00:00:00
      in: query
      name: updated_since
      required: false
      schema:
        type: string
      x-holdsport-quirk: |
        Compared as given by the database; there is no validation. The old
        Rails server answered `500` whenever this parameter was sent.
    AttendanceActivityId:
      description: Activity id.
      example: 51234567
      in: path
      name: activity_id
      required: true
      schema:
        type: integer
    AttendanceLocale:
      description: Language of `status` in the answer. Default the user's language.
      example: en
      in: query
      name: locale
      required: false
      schema:
        type: string
    AttendanceRowId:
      description: |
        The answer row's `id`: from the `PUT` `action_path`, or from the
        response to a `POST`. Ids in `activities_users` are answer ids except
        for the generated attending entries of "everybody attends"
        activities, which are list positions.
      example: 210000001
      in: path
      name: id
      required: true
      schema:
        type: integer
    MemberTeamId:
      description: |
        Team id, or the team's URL slug. A numeric value is first tried as a
        slug, then as an id (leading zeros allowed, so `064001` is team
        64001); anything else is only a slug.
      example: '64001'
      in: path
      name: team_id
      required: true
      schema:
        type: string
  responses:
    ActivityAttendanceSaved:
      content:
        application/json:
          example:
            id: 210000001
            name: Alex Example
            status: Attending
            status_code: 1
            updated_at: 2026-11-20T09:15:02+01:00
            user_id: 700001
          schema:
            $ref: '#/components/schemas/ActivityAttendee'
      description: The stored answer.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        ETag:
          $ref: '#/components/headers/ETag'
    ActivityList:
      content:
        application/json:
          example:
            - action_method: PUT
              action_path: /v1/activities/51234567/activities_users/210000001
              actions:
                - activities_user:
                    joined_status: 2
                    name: Not attending
                    picked: 1
                    user_id: 700001
              activities_users:
                - id: 210000001
                  name: Alex Example
                  status: Attending
                  status_code: 1
                  updated_at: 2026-11-20T09:15:02+01:00
                  user_id: 700001
                - id: 210000002
                  name: Sam Sample
                  status: Not attending
                  status_code: 2
                  updated_at: 2026-11-20T10:01:44+01:00
                  user_id: 700002
              club: 'false'
              comment: |-
                Bring both shoes.

                Parking behind the hall.
              comments: []
              department: false
              endtime: 2026-11-24T19:30:00+01:00
              event_type: Training
              event_type_id: 2
              id: 51234567
              max_attendees: 999
              name: 'Training '
              no_rsvp:
                - id: 700003
                  name: Kim Example
              no_rsvp_count: 1
              pickup_place: ''
              pickup_time: 17:30
              place: Example Hall
              registration_type: 0
              ride: true
              ride_comment: ''
              rides:
                - comment: Leaving from the station
                  firstname: Alex
                  id: 880001
                  lastname: Example
                  seats: 3
                  user_id: 700001
              show_ride_button: true
              starttime: 2026-11-24T18:00:00+01:00
              status: 1
          schema:
            items:
              $ref: '#/components/schemas/Activity'
            type: array
      description: The page of activities, possibly an empty array.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        ETag:
          $ref: '#/components/headers/ETag'
    ActivityOne:
      content:
        application/json:
          example:
            action_method: GET
            action_path: https://holdsport.dk/sign_in/700001/EXAMPLE-TOKEN?after=https%3A%2F%2Fholdsport.dk%2Factivities%2F51234568%3Fapp_version%3Dtrue
            actions:
              - activities_user:
                  joined_status: 1
                  name: Pay
                  picked: 1
                  user_id: 700001
              - activities_user:
                  joined_status: 2
                  name: Not attending
                  picked: 1
                  user_id: 700001
            activities_users: []
            club: 'true'
            comment: ''
            comments:
              - comment: See you there!
                created_at: 2026-11-20T12:00:00+01:00
                id: 990001
                name: Sam Sample
                user_id: 700002
            department: false
            endtime: ''
            event_type: Social activity
            event_type_id: 3
            id: 51234568
            max_attendees: 120
            name: Club party
            no_rsvp:
              - id: 700001
                name: Alex Example
              - id: 700002
                name: Sam Sample
            no_rsvp_count: 2
            pickup_place: ''
            pickup_time: ''
            place: ''
            registration_type: 0
            ride: false
            ride_comment: ''
            rides: []
            show_ride_button: false
            starttime: 2026-12-05T19:00:00+01:00
            status: 0
          schema:
            $ref: '#/components/schemas/Activity'
      description: The activity.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        ETag:
          $ref: '#/components/headers/ETag'
    BadRequest:
      content:
        application/json:
          example:
            error: Bad Request
            status: 400
          schema:
            $ref: '#/components/schemas/Error'
      description: |
        The request could not be parsed: an invalid JSON body or an invalidly
        encoded query string. Do not retry it unchanged.
    BasicUnauthorized:
      content:
        text/html:
          example: |
            HTTP Basic: Access denied.
          schema:
            type: string
      description: Missing or wrong credentials.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
    InternalServerError:
      content:
        application/json:
          example:
            error: Internal Server Error
            status: 500
          schema:
            $ref: '#/components/schemas/Error'
      description: Unexpected error.
    LoginBusy:
      content:
        application/json:
          example:
            error: Service Unavailable
            status: 503
          schema:
            $ref: '#/components/schemas/Error'
      description: |
        Too many logins without a recent successful login are being checked
        at the same time. Retry after the `Retry-After` seconds. A proxy in
        front of the API can also answer `503` (then possibly with an HTML
        body) while the service restarts.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
    NotAcceptable:
      description: A path extension other than `.json` (for example `.ics`) on a read. Empty body.
    NotFound:
      content:
        application/json:
          example:
            error: Not Found
            status: 404
          schema:
            $ref: '#/components/schemas/Error'
      description: Unknown or unreadable resource, or an unknown path.
    NotModified:
      description: The `If-None-Match` header matched the current ETag. Empty body.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    PayloadTooLarge:
      content:
        application/json:
          example:
            error: Payload Too Large
            status: 413
          schema:
            $ref: '#/components/schemas/Error'
      description: |
        The request body is too large. Bodies are read on every method but
        `OPTIONS`, so a `GET` with an oversized body gets this too.
    TeamUnauthorized:
      content:
        application/json:
          x-holdsport-empty-body: true
        text/html:
          example: |
            HTTP Basic: Access denied.
          schema:
            type: string
          x-holdsport-required-headers:
            - WWW-Authenticate
      description: |
        For operations on one team, a `401` is one of two answers:

        - missing or wrong credentials: the Basic challenge (content type
          `text/html`, `WWW-Authenticate: Basic realm="API"`, body
          `HTTP Basic: Access denied.` followed by a newline);
        - authenticated, but the user is neither a member nor an admin of the
          team: an empty body with content type `application/json` (no
          `charset` parameter) and no `WWW-Authenticate` header.
      headers:
        WWW-Authenticate:
          description: Only on the Basic challenge (`text/html`). Always `Basic realm="API"`.
          required: false
          schema:
            const: Basic realm="API"
            type: string
    UnprocessableEntity:
      content:
        application/json:
          example:
            status: error
          schema:
            $ref: '#/components/schemas/StatusError'
      description: The write was refused.
  schemas:
    Activity:
      additionalProperties: false
      description: |
        An activity as the user sees it. Times are Copenhagen time with an
        explicit offset (`+01:00` or `+02:00`), whatever the club's time zone.
      properties:
        action_method:
          enum:
            - GET
            - PUT
            - POST
          type: string
        action_path:
          description: |
            Where the answer goes: `/v1/activities/{id}/activities_users`
            (POST) when the user has no answer row,
            `/v1/activities/{id}/activities_users/{row id}` (PUT) when they
            have one. For payment activities a web sign-in link to the
            activity's checkout page (GET).
          type: string
          x-holdsport-quirk: |
            The payment link contains the user's personal login token. Treat
            it as a secret: do not log it or show it to others.
        actions:
          description: |
            The answers the user may give now, in display order. Send one as
            the body of `action_method` `action_path`. Empty for cancelled,
            locked, past or closed activities.
          items:
            $ref: '#/components/schemas/ActivityAction'
          type: array
        activities_coaches:
          description: |
            Present only when only players count towards the limit and a coach
            has answered: the coaches' answers (with hidden registrations, an
            ordinary member gets only their own).
          items:
            $ref: '#/components/schemas/ActivityAnswer'
          type: array
        activities_users:
          description: |
            The answers on the activity, one per member, in no guaranteed
            order. On everybody-attending activities: one entry per attending
            member (with `id` 1, 2, … and `updated_at` = when the activity was
            created) followed by the declines. Those `id`s are positions in
            name order (first name, last name; equal names by user id, where
            the old implementation's order was undefined), so they change when
            members join or leave: match entries by `user_id`. When only
            players count, the coaches' answers are in `activities_coaches`
            instead. With "Hide member registration status" on, an ordinary
            member gets only their own entry.
          items:
            $ref: '#/components/schemas/ActivityAnswer'
          type: array
        club:
          description: '`"true"` when the activity is linked to a whole club.'
          enum:
            - 'true'
            - 'false'
          type: string
          x-holdsport-quirk: A string, not a boolean.
        comment:
          description: |
            The description as plain text: paragraph ends become a blank
            line, `<br />` a line break, other tags are removed. HTML entities
            (`&amp;`) stay as they are.
          type: string
          x-holdsport-quirk: |
            Two Danish notes can be appended whatever the language: one when
            the answers shown may differ from the web version, and one listing
            the attending coaches when only players count towards the limit.
        comments:
          description: |
            Comments on the activity, newest first, replies included. An
            ordinary member gets only the comments for all members and the
            replies to them, not the coach-only ones (for example a member's
            reason for declining); see the Activities guide for who gets
            every comment.
          items:
            $ref: '#/components/schemas/ActivityComment'
          type: array
        department:
          description: True when the activity is linked to a department, or to more than one team.
          type: boolean
        endtime:
          description: ISO 8601 time, or `""` without an end time.
          type: string
        event_type:
          description: The event type, translated for the default types.
          type:
            - string
            - 'null'
        event_type_id:
          type:
            - integer
            - 'null'
        id:
          type: integer
        max_attendees:
          description: The attendance limit; 999 means no limit.
          type:
            - integer
            - 'null'
        name:
          description: The name as the club wrote it (often with trailing spaces). Cancelled activities have no prefix.
          type:
            - string
            - 'null'
        no_rsvp:
          description: |
            The first 20 members without an answer, by name (compared byte by
            byte). Always empty on everybody-attending activities. With hidden
            registrations, users who are not coaches, club admins or editors
            get only their own entry, if it is among the 20.
          items:
            additionalProperties: false
            properties:
              id:
                type: integer
              name:
                type:
                  - string
                  - 'null'
            required:
              - id
              - name
            type: object
          type: array
        no_rsvp_count:
          description: How many invited members have not answered.
          type: integer
        pickup_place:
          type: string
        pickup_time:
          description: Free text as entered (usually `HH:MM`, but not always a time).
          type: string
        place:
          type: string
        registration_type:
          description: |
            0 normal, 1 pick out, 2 available, 4 pick out from sub-teams,
            5 no registration.
          enum:
            - 0
            - 1
            - 2
            - 4
            - 5
          type: integer
          x-holdsport-quirk: Everybody-attending activities (type 3) are sent as 0.
        ride:
          description: Whether members can offer rides.
          type: boolean
        ride_comment:
          type: string
        rides:
          description: The rides offered, oldest first.
          items:
            $ref: '#/components/schemas/ActivityRide'
          type: array
        show_ride_button:
          description: True when rides are on and the user is attending.
          type: boolean
        starttime:
          format: date-time
          type:
            - string
            - 'null'
        status:
          description: |
            The user's own answer: 0 none, 1 attending, 2 not attending,
            3 available, 4 picked, 5 unknown. 0 also on everybody-attending
            activities when the user has not answered.
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
          type: integer
      required:
        - id
        - club
        - department
        - name
        - starttime
        - endtime
        - comment
        - place
        - pickup_place
        - pickup_time
        - status
        - registration_type
        - actions
        - action_path
        - action_method
        - activities_users
        - comments
        - max_attendees
        - no_rsvp_count
        - no_rsvp
        - ride
        - ride_comment
        - rides
        - show_ride_button
        - event_type
        - event_type_id
      type: object
    ActivityAction:
      additionalProperties: false
      properties:
        activities_user:
          additionalProperties: false
          properties:
            joined_status:
              description: 1 attend (or pay), 0 available, 2 not attending.
              enum:
                - 0
                - 1
                - 2
              type: integer
            name:
              description: The button text in the user's language.
              type: string
            picked:
              enum:
                - 1
              type: integer
            user_id:
              description: Always the user's own id.
              type: integer
          required:
            - user_id
            - picked
            - joined_status
            - name
          type: object
      required:
        - activities_user
      type: object
    ActivityAnswer:
      additionalProperties: false
      description: One member's answer, as embedded in an activity.
      properties:
        id:
          type: integer
        name:
          type:
            - string
            - 'null'
        status:
          description: The status in the user's language. Use `status_code` in code.
          type: string
        status_code:
          description: 1 attending, 2 not attending, 3 available, 4 picked, 5 unknown (no answer yet).
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
          type: integer
        updated_at:
          description: When the answer row was last saved.
          type:
            - string
            - 'null'
        user_id:
          type: integer
      required:
        - id
        - name
        - status
        - status_code
        - updated_at
        - user_id
      type: object
    ActivityAttendanceWrite:
      description: |
        The answer, inside `activities_user` (or as a flat JSON object, where
        `user_id` is dropped).
      properties:
        activities_user:
          properties:
            joined_status:
              description: 0 no answer (with `picked` 1, available), 1 attending, 2 not attending. Required on create.
              examples:
                - 1
              type:
                - integer
                - string
            picked:
              description: 1 picked or available, 0 not. Default 1 on create.
              examples:
                - 1
              type:
                - integer
                - string
            user_id:
              description: Create only. Answer for this member instead of yourself (coaches and club managers).
              examples:
                - 700001
              type:
                - integer
                - string
          type: object
      type: object
    ActivityAttendee:
      additionalProperties: false
      description: |
        One member's answer to an activity. The same object is returned by the
        attendance writes.
      properties:
        id:
          description: The answer row's id; `null` for an entry without a row.
          type:
            - integer
            - 'null'
        name:
          type:
            - string
            - 'null'
        status:
          description: The status in the user's language. Use `status_code` in code.
          type: string
        status_code:
          description: 1 attending, 2 not attending, 3 available, 4 picked, 5 unknown.
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
          type: integer
        updated_at:
          description: When the member last changed their answer; `null` for old rows and entries without a row.
          type:
            - string
            - 'null'
        user_id:
          type: integer
      required:
        - id
        - user_id
        - name
        - status
        - status_code
        - updated_at
      type: object
    ActivityComment:
      additionalProperties: false
      properties:
        comment:
          description: The comment as stored (HTML is not removed).
          type:
            - string
            - 'null'
        created_at:
          type: string
        id:
          type: integer
        name:
          description: The author's name, `""` when unknown.
          type: string
        user_id:
          type:
            - integer
            - 'null'
      required:
        - id
        - created_at
        - user_id
        - name
        - comment
      type: object
    ActivityGuest:
      additionalProperties: false
      description: One guest a member brings to an activity.
      properties:
        id:
          description: The guest's id. Stable while the guest stays registered.
          type: integer
        name:
          description: |
            The guest's name; `null` when none was entered or when the
            activity does not require guest names (then the website shows only
            the member who brought the guest).
          type:
            - string
            - 'null'
        type:
          description: The guest type's name as the coach wrote it (not translated).
          type: string
        user_id:
          description: The member who brought the guest.
          type:
            - integer
            - 'null'
        user_name:
          description: "The member's name; `null` when the member's account is deleted."
          type:
            - string
            - 'null'
      required:
        - id
        - user_id
        - user_name
        - type
        - name
      type: object
    ActivityRide:
      additionalProperties: false
      properties:
        comment:
          type:
            - string
            - 'null'
        firstname:
          description: "The driver's first name; `null` when the driver's account is gone."
          type:
            - string
            - 'null'
        id:
          type: integer
        lastname:
          type:
            - string
            - 'null'
        seats:
          type: integer
        user_id:
          type:
            - integer
            - 'null'
      required:
        - id
        - comment
        - seats
        - user_id
        - firstname
        - lastname
      type: object
    ActivityTaskAssignRequest:
      description: |
        The assignment, inside `activity_task` (or as a flat JSON object with
        `task_type_id` and `user_id`).
      properties:
        activity_task:
          properties:
            task_type_id:
              description: A task type of the activity.
              examples:
                - 900001
              type:
                - integer
                - string
            user_id:
              description: Assign this member instead of yourself (coaches and club managers).
              examples:
                - 700001
              type:
                - integer
                - string
          type: object
      type: object
    ActivityTaskAssignment:
      additionalProperties: false
      description: A member assigned to a task.
      properties:
        id:
          description: Assignment id.
          type: integer
        name:
          description: "The member's name, or \"deleted user\" in the user's language when the member's account is gone."
          type: string
        user_id:
          description: The assigned member's user id.
          type:
            - integer
            - 'null'
      required:
        - id
        - user_id
        - name
      type: object
    ActivityTaskType:
      additionalProperties: false
      description: A task type of the activity with its assignments.
      properties:
        activity_id:
          description: The activity the task type belongs to; `null` for a global task type.
          type:
            - integer
            - 'null'
        activity_tasks:
          description: The members assigned to the task, oldest assignment first.
          items:
            $ref: '#/components/schemas/ActivityTaskAssignment'
          type: array
        enable_attend:
          description: |
            Meant as "members can pick this task themselves", but always `true`
            unless the stored value is missing.
          type: boolean
          x-holdsport-quirk: |
            The stored value is an integer (0 or 1) and the API converts it with
            Ruby's `!!`, which turns 0 into `true`. Only a task type without a
            stored value gives `false`. The order of the list (pickable types
            before the others) still follows the stored value.
        id:
          description: Task type id.
          type: integer
        max_participants:
          description: How many members can take the task; `null` or `0` means no limit.
          type:
            - integer
            - 'null'
        name:
          description: |
            The task's name. The built-in global tasks (bring beers, candy,
            cake, sodas, fruit; do laundry) are translated into the user's
            language; every other name is shown as the club wrote it.
          type:
            - string
            - 'null'
      required:
        - id
        - name
        - max_participants
        - enable_attend
        - activity_id
        - activity_tasks
      type: object
    AttendanceDeleted:
      additionalProperties: false
      properties:
        status:
          const: ok
          type: string
      required:
        - status
      type: object
    CurrentUser:
      additionalProperties: false
      properties:
        addresses:
          items:
            $ref: '#/components/schemas/CurrentUserAddress'
          maxItems: 2
          minItems: 1
          type: array
        age:
          description: |
            Whole years from the birthday (Copenhagen date). Without a birthday:
            the default team's average age (a decimal, for example `13.96`), or
            `null` when that is unknown too.
          type:
            - integer
            - number
            - 'null'
          x-holdsport-quirk: The value can be an integer, a decimal or null.
        birthday:
          description: '`YYYY-MM-DD` (four-digit year), or `""` when unknown.'
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        firstname:
          type: string
        gender:
          description: '`female` for women; `male` otherwise, also when unknown.'
          enum:
            - female
            - male
          type: string
          x-holdsport-quirk: An unknown gender is reported as `male`.
        id:
          type: integer
        lastname:
          type: string
        profile_picture_path:
          description: |
            Relative path of a 200x200 thumbnail, `""` when the user has no
            picture or the stored file is not an image.
          type: string
      required:
        - id
        - firstname
        - lastname
        - birthday
        - profile_picture_path
        - addresses
        - gender
        - age
      type: object
    CurrentUserAddress:
      additionalProperties: false
      properties:
        city:
          type: string
        email:
          description: |
            First address: the user's first e-mail address. Second address:
            the raw second e-mail field.
          type: string
        email_ex:
          type: string
        mobile:
          type: string
        parents_name:
          type: string
        postcode:
          type: string
        street:
          type: string
        telephone:
          type: string
      required:
        - street
        - city
        - postcode
        - telephone
        - mobile
        - email
        - email_ex
        - parents_name
      type: object
    Error:
      additionalProperties: false
      description: Error body of 400, 404, 413, 500 and 503 responses.
      properties:
        error:
          examples:
            - Not Found
          type: string
        status:
          examples:
            - 404
          type: integer
      required:
        - status
        - error
      type: object
    Member:
      additionalProperties: false
      description: A team member as the user sees them.
      properties:
        addresses:
          description: |
            The primary address, and a second one only when the member has
            any second-address data (for example a second parent).
          items:
            $ref: '#/components/schemas/MemberAddress'
          maxItems: 2
          minItems: 1
          type: array
        birthday:
          anyOf:
            - format: date
              type: string
            - type: 'null'
            - const: false
          description: |
            `YYYY-MM-DD`; `null` when unknown; `false` when the user may not
            see the member's contact data.
        club_fields:
          anyOf:
            - items:
                $ref: '#/components/schemas/MemberClubField'
              type: array
            - maxProperties: 0
              type: object
          description: |
            The club's member fields with this member's value. An empty object
            `{}` (not an array) when the team belongs to no club.
        firstname:
          description: First name as stored (may carry trailing spaces).
          type:
            - string
            - 'null'
        id:
          description: The member's user id.
          type: integer
        lastname:
          description: Last name as stored.
          type:
            - string
            - 'null'
        member_number:
          description: The member number on this team; `""` when not set.
          type: string
        profile_picture_path:
          description: |
            Path of the 200x200 thumbnail (`/media/<job>?sha=<signature>`),
            relative to the API host (`https://api.holdsport.dk`); `""` when
            the member has no picture. Use it as given: the signature covers
            the path.
          type: string
        role:
          description: |
            The member's role on this team (first match wins):

            | value | meaning |
            |---|---|
            | 5 | inactive member (any role; only from `getTeamMember`) |
            | 4 | injured member (any role; only from `getTeamMember`) |
            | 3 | assistant coach |
            | 6 | team leader |
            | 2 | coach |
            | 1 | player (any other membership) |
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
          type: integer
      required:
        - id
        - firstname
        - lastname
        - role
        - member_number
        - birthday
        - addresses
        - profile_picture_path
        - club_fields
      type: object
    MemberAddress:
      additionalProperties: false
      description: |
        One address. When the user may not see the member's contact data, the
        strings are `""` and `email`/`email_ex` are `false`; `parents_name` is
        always given.
      properties:
        city:
          type: string
        email:
          anyOf:
            - type: string
            - type: 'null'
            - const: false
          description: |
            First address: the member's first e-mail address (`null` when the
            member has none). Second address: the second e-mail field as
            stored (`null` or `""` possible). `false` when hidden.
        email_ex:
          anyOf:
            - type: string
            - type: 'null'
            - const: false
          description: The extra e-mail field as stored (`null` or `""` possible); `false` when hidden.
        mobile:
          type: string
        parents_name:
          description: The parent's name as stored; not hidden.
          type:
            - string
            - 'null'
        postcode:
          type: string
        street:
          type: string
        telephone:
          type: string
      required:
        - street
        - city
        - postcode
        - telephone
        - mobile
        - email
        - email_ex
        - parents_name
      type: object
    MemberClubField:
      additionalProperties: false
      description: A club member field and this member's value.
      properties:
        club_field_id:
          description: The club field's id.
          type: integer
        value:
          description: |
            The member's latest text value for the field, as stored; `null`
            when none. Select, checkbox, date and attachment fields keep their
            data elsewhere, so their value is usually `null` or `""`.
          type:
            - string
            - 'null'
      required:
        - club_field_id
        - value
      type: object
    Note:
      additionalProperties: false
      description: A note on the team's notice board.
      properties:
        attachment_path:
          description: |
            Path of the attached file (`/media/<job>/<file name>?sha=<signature>`),
            relative to the API host (`https://api.holdsport.dk`;
            `https://www.holdsport.dk` serves it too); `null` without an
            attachment. Use it as given: the signature covers the path.
          type:
            - string
            - 'null'
        body:
          description: |
            The note's text as stored: usually HTML from the web editor, or
            plain text with newlines from the app. Sanitise before rendering.
          type:
            - string
            - 'null'
        created_at:
          description: When the note was posted, in Danish time with its offset (`+01:00` or `+02:00`).
          format: date-time
          type: string
        created_by:
          description: |
            The author's name. When the author's account no longer exists, the
            translated text for "deleted user" in the user's language.
          type: string
        title:
