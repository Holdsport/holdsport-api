      responses:
        '200':
          content:
            application/json:
              example:
                - id: 241001
                  name: Jamie Guest
                  type: Guest player
                  user_id: 700001
                  user_name: Alex Example
                - id: 241002
                  name: Kim Guest
                  type: Guest player
                  user_id: 700001
                  user_name: Alex Example
                - id: 241003
                  name:
                  type: Adult
                  user_id: 700002
                  user_name: Sam Sample
              schema:
                items:
                  $ref: '#/components/schemas/ActivityGuest'
                type: array
          description: The guests, possibly an empty array.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/BasicUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LoginBusy'
      summary: List the guests members bring to an activity
      tags:
        - Attendance
