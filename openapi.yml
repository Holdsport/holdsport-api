    get:
      description: |
        One member of a team, in the same shape as an element of
        `listTeamMembers`.

        **When to use:** refresh a single roster entry. Read-only; no side
        effects.

        Access, contact data and club fields follow `listTeamMembers`. Unlike
        the list, any status is returned, so `role` can be 4 (injured) or 5
        (inactive).

        **Not found is `200 {}`:** when the team has no member with this user
        id (or the account no longer exists), the answer is `200` with an
        empty object, not `404`. A non-numeric `id` counts as `0` and gets
        `{}` too; only an unknown team is `404`.
      operationId: getTeamMember
      parameters:
        - $ref: '#/components/parameters/MemberTeamId'
        - description: |
            The member's user id (`id` in `listTeamMembers`). Read like Ruby's
            `to_i`: leading digits count (`"42abc"` is 42), anything else is 0.
          example: '100001'
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: The `ETag` of an earlier response; a match answers `304`.
          in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example:
                addresses:
                  - city: ''
                    email:
                    email_ex:
                    mobile: ''
                    parents_name:
                    postcode: ''
                    street: ''
                    telephone: ''
                birthday:
                club_fields: {}
                firstname: Robin
                id: 100003
                lastname: Sample
                member_number: ''
                profile_picture_path: ''
                role: 5
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Member'
                  - description: No such member on the team.
                    maxProperties: 0
                    type: object
          description: The member, or `{}` when the team has no such member.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/TeamUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LoginBusy'
      summary: Get one member of a team
      tags:
        - Members
  /v1/teams/{team_id}/notes:
    get:
      description: |
        The notes (bulletin-board posts) written on one team.

        **When to use:** show a team's notice board. Read-only; no side effects.

        **Who can read:** only users on the team, in any role or status. A club
        or department admin who is not on the team gets `404`, as does an
        unknown or deleted team.

        **Which notes:** only notes posted on this team; club and department
        notes are not included. Oldest first (by creation), no pagination
        (`page`/`per_page` are ignored). When the club has turned the team's
        notes off, the answer is `200` with `[]`.
      operationId: listTeamNotes
      parameters:
        - description: |
            Team id, or the team's URL slug. A numeric value is first tried as a
            slug, then as an id (leading zeros allowed, so `064001` is team
            64001); anything else is only a slug.
          example: '64001'
          in: path
          name: team_id
          required: true
          schema:
            type: string
        - description: The `ETag` of an earlier response; a match answers `304`.
          in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example:
                - attachment_path:
                  body: <p>Thursday's training starts at 18:30.</p>
                  created_at: 2026-03-05T19:37:31+01:00
                  created_by: Alex Example
                  title: Training moved
                - attachment_path: /media/W1siZiIsIjIwMjYvMDgvMjAvYWJjMTIzX3NjaGVkdWxlLnBkZiJdXQ/Match%20schedule.pdf?sha=0123456789abcdef
                  body: See the attached schedule.
                  created_at: 2026-08-20T20:13:02+02:00
                  created_by: Deleted user
                  title: Match schedule
              schema:
                items:
                  $ref: '#/components/schemas/Note'
                type: array
          description: The notes, possibly an empty array.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/BasicUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LoginBusy'
      summary: List a team's notes
      tags:
        - Notes
  /v1/teams/{team_id}/sub_teams:
    get:
      description: |
        The player colours ("Spillerfarve", "Spielerfarbe") of one team: the
        coloured groups a coach splits the team into, for example to invite
        only the blue players to an activity. One entry per colour, in the
        order the coach created them, with the user ids of its members.

        `user_ids` holds the members that `listTeamMembers` lists (active
        status, existing account), sorted by user id; match them on `id`
        there. A member has at most one colour on a team; members without a
        colour are in no entry.

        **Hidden colours:** when the team hides player colours from players
        and the user is a player on the team (also an inactive or injured
        player, and also a club or department admin who is a player on the
        team), the answer is an empty array, as the member lists on the
        website and in the app then show no colours. Coaches of the team and
        admins who are not players on it get the colours.

        **When to use:** show each member's colour next to a roster or an
        attendance list. Read-only; no side effects.

        **Who can read:** as for `listTeamMembers`: anyone on the team, a
        coach of it, a manager of a club it belongs to, or a holder of a
        department role in a department it belongs to. Anyone else gets an
        empty `401` (no `WWW-Authenticate` header). An unknown or deleted team
        is `404`.
      operationId: listTeamSubTeams
      parameters:
        - $ref: '#/components/parameters/MemberTeamId'
        - description: The `ETag` of an earlier response; a match answers `304`.
          in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example:
                - color: '#4299E1'
                  id: 120001
                  name: Blue
                  user_ids:
                    - 700001
                    - 700004
                - color: '#E53E3E'
                  id: 120002
                  name: Red
                  user_ids: []
              schema:
                items:
                  $ref: '#/components/schemas/SubTeam'
                type: array
          description: The player colours, possibly an empty array.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/TeamUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/LoginBusy'
      summary: List a team's player colours and their members
      tags:
        - Members
  /v1/user:
